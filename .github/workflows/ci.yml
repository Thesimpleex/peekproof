name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync --locked --all-extras --dev
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type-check
        run: uv run mypy src
      - name: Test
        run: uv run pytest -q

  oldest-pandas:
    name: pandas 2.2 (declared minimum)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install with pandas 2.2
        run: uv sync --locked --all-extras --dev && uv pip install "pandas>=2.2,<2.3" "numpy<2.3"
      - name: Test
        run: uv run --no-sync pytest -q

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Build
        run: uv build
      - name: Check wheel contents
        run: unzip -l dist/*.whl | grep -E "peekproof/(__init__|oracle|cli)\.py" && unzip -l dist/*.whl | grep -q "LICENSE"
