[project]
name = "peekproof"
version = "0.1.0"
description = "Detect look-ahead leakage in backtests: a dynamic causality oracle and a static linter for research code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Alexander Majores", email = "alexmajores@outlook.de" }
]
requires-python = ">=3.12"
keywords = [
    "backtesting",
    "backtest",
    "look-ahead bias",
    "lookahead bias",
    "data leakage",
    "target leakage",
    "future leakage",
    "temporal leakage",
    "overfitting",
    "quantitative finance",
    "quant",
    "algorithmic trading",
    "trading strategy",
    "time series",
    "feature engineering",
    "cross-validation",
    "pandas",
    "polars",
    "scikit-learn",
    "linter",
    "static analysis",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
]

[project.optional-dependencies]
polars = ["polars>=1.0", "pyarrow>=17"]

[project.urls]
Homepage = "https://github.com/Thesimpleex/peekproof"
Repository = "https://github.com/Thesimpleex/peekproof"
Issues = "https://github.com/Thesimpleex/peekproof/issues"

[project.scripts]
peekproof = "peekproof.cli:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "polars>=1.0",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "matplotlib>=3.11.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:peekproof.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "N806"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
# pandas returns are frequently typed as Any; keep strictness elsewhere.
warn_return_any = false
# polars is an optional dependency imported lazily inside functions.
ignore_missing_imports = true
files = ["src"]
