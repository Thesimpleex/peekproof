<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">How the peekproof oracle tests a feature function for look-ahead leakage</title>
  <desc id="desc">The function is evaluated on the full history and on the history truncated at a cutoff. Rows at or before the cutoff must agree; any difference or missing row is a leak, and the distance from the cutoff to the first affected row is the leak horizon.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0b0b0b; }
    .muted { fill: #52514e; }
    .small { font-size: 12px; }
    .label { font-size: 13.5px; font-weight: 600; }
    .badge { font-size: 12px; font-weight: 700; fill: #ffffff; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }
    .past { fill: #d9e8fb; stroke: #2a78d6; stroke-width: 1; }
    .future { fill: #fde3d8; stroke: #eb6834; stroke-width: 1; }
    .out { fill: #ffffff; stroke: #a8a6a0; stroke-width: 1; }
    .outbad { fill: #fbd7d6; stroke: #e34948; stroke-width: 1.6; animation: pulse 2.4s ease-in-out infinite; }
    .missing { fill: none; stroke: #e34948; stroke-width: 1.6; stroke-dasharray: 3 2; animation: pulse 2.4s ease-in-out infinite; }
    .arrow { stroke: #52514e; stroke-width: 1.5; fill: none; marker-end: url(#head); }
    .cut { stroke: #0b0b0b; stroke-width: 1.5; stroke-dasharray: 5 4; animation: march 1.6s linear infinite; }
    .bracket { stroke: #a8a6a0; stroke-width: 1.2; fill: none; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
    @keyframes march { to { stroke-dashoffset: -18; } }
  </style>
  <defs>
    <marker id="head" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#52514e"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="979" height="359" rx="14" fill="#fcfcfb" stroke="#0b0b0b" stroke-opacity="0.12"/>

  <!-- Step 1: full history -->
  <circle cx="40" cy="50" r="11" fill="#0b0b0b"/>
  <text x="40" y="54.5" text-anchor="middle" class="badge">1</text>
  <text x="60" y="55" class="label">Full history D</text>
  <g transform="translate(40,70)">
    <rect class="past" x="0" y="0" width="22" height="26" rx="4"/>
    <rect class="past" x="26" y="0" width="22" height="26" rx="4"/>
    <rect class="past" x="52" y="0" width="22" height="26" rx="4"/>
    <rect class="past" x="78" y="0" width="22" height="26" rx="4"/>
    <rect class="past" x="104" y="0" width="22" height="26" rx="4"/>
    <rect class="past" x="130" y="0" width="22" height="26" rx="4"/>
    <rect class="past" x="156" y="0" width="22" height="26" rx="4"/>
    <rect class="past" x="182" y="0" width="22" height="26" rx="4"/>
    <rect class="future" x="208" y="0" width="22" height="26" rx="4"/>
    <rect class="future" x="234" y="0" width="22" height="26" rx="4"/>
    <rect class="future" x="260" y="0" width="22" height="26" rx="4"/>
    <rect class="future" x="286" y="0" width="22" height="26" rx="4"/>
    <text x="0" y="46" class="small muted">rows up to the cutoff t</text>
    <text x="214" y="46" class="small muted">rows after t</text>
  </g>
  <line class="cut" x1="246" y1="62" x2="246" y2="132"/>
  <text x="252" y="132" class="small muted">cutoff t</text>

  <path class="arrow" d="M362,83 L410,83"/>
  <text x="380" y="75" class="mono">f</text>

  <text x="426" y="55" class="label">f(D)</text>
  <g transform="translate(426,70)">
    <rect class="out" x="0" y="0" width="22" height="26" rx="4"/>
    <rect class="out" x="26" y="0" width="22" height="26" rx="4"/>
    <rect class="out" x="52" y="0" width="22" height="26" rx="4"/>
    <rect class="out" x="78" y="0" width="22" height="26" rx="4"/>
    <rect class="out" x="104" y="0" width="22" height="26" rx="4"/>
    <rect class="out" x="130" y="0" width="22" height="26" rx="4"/>
    <rect class="outbad" x="156" y="0" width="22" height="26" rx="4"/>
    <rect class="outbad" x="182" y="0" width="22" height="26" rx="4"/>
    <rect class="out" x="208" y="0" width="22" height="26" rx="4" opacity="0.3"/>
    <rect class="out" x="234" y="0" width="22" height="26" rx="4" opacity="0.3"/>
    <rect class="out" x="260" y="0" width="22" height="26" rx="4" opacity="0.3"/>
    <rect class="out" x="286" y="0" width="22" height="26" rx="4" opacity="0.3"/>
  </g>
  <line class="cut" x1="632" y1="62" x2="632" y2="106"/>

  <!-- Step 2: truncated history -->
  <circle cx="40" cy="186" r="11" fill="#0b0b0b"/>
  <text x="40" y="190.5" text-anchor="middle" class="badge">2</text>
  <text x="60" y="191" class="label">Truncated history D[:t]</text>
  <g transform="translate(40,206)">
    <rect class="past" x="0" y="0" width="22" height="26" rx="4"/>
    <rect class="past" x="26" y="0" width="22" height="26" rx="4"/>
    <rect class="past" x="52" y="0" width="22" height="26" rx="4"/>
    <rect class="past" x="78" y="0" width="22" height="26" rx="4"/>
    <rect class="past" x="104" y="0" width="22" height="26" rx="4"/>
    <rect class="past" x="130" y="0" width="22" height="26" rx="4"/>
    <rect class="past" x="156" y="0" width="22" height="26" rx="4"/>
    <rect class="past" x="182" y="0" width="22" height="26" rx="4"/>
    <text x="0" y="46" class="small muted">the future is removed, or scrambled in the perturbation test</text>
  </g>
  <line class="cut" x1="246" y1="198" x2="246" y2="242"/>

  <path class="arrow" d="M362,219 L410,219"/>
  <text x="380" y="211" class="mono">f</text>

  <text x="426" y="191" class="label">f(D[:t])</text>
  <g transform="translate(426,206)">
    <rect class="out" x="0" y="0" width="22" height="26" rx="4"/>
    <rect class="out" x="26" y="0" width="22" height="26" rx="4"/>
    <rect class="out" x="52" y="0" width="22" height="26" rx="4"/>
    <rect class="out" x="78" y="0" width="22" height="26" rx="4"/>
    <rect class="out" x="104" y="0" width="22" height="26" rx="4"/>
    <rect class="out" x="130" y="0" width="22" height="26" rx="4"/>
    <rect class="out" x="156" y="0" width="22" height="26" rx="4"/>
    <rect class="missing" x="182" y="0" width="22" height="26" rx="4"/>
  </g>
  <line class="cut" x1="632" y1="198" x2="632" y2="242"/>

  <!-- Comparison bracket -->
  <path class="bracket" d="M648,80 L668,80 L668,222 L648,222"/>
  <path class="bracket" d="M668,151 L676,151"/>

  <!-- Step 3: verdict -->
  <circle cx="690" cy="110" r="11" fill="#0b0b0b"/>
  <text x="690" y="114.5" text-anchor="middle" class="badge">3</text>
  <text x="710" y="115" class="label">Compare rows ≤ t</text>
  <text x="690" y="142" class="small">identical values, same rows</text>
  <text x="690" y="159" class="small muted">→ causal at this cutoff</text>
  <text x="690" y="186" class="small">value changed or row missing</text>
  <text x="690" y="203" class="small muted">→ leak; horizon = t − first affected row</text>

  <!-- Legend -->
  <g transform="translate(40,292)">
    <rect class="past" x="0" y="0" width="14" height="14" rx="3"/>
    <text x="20" y="11" class="small muted">input rows at or before t</text>
    <rect class="future" x="196" y="0" width="14" height="14" rx="3"/>
    <text x="216" y="11" class="small muted">input rows after t</text>
    <rect x="348" y="0" width="14" height="14" rx="3" fill="#fbd7d6" stroke="#e34948" stroke-width="1.6"/>
    <text x="368" y="11" class="small muted">output at or before t that changed</text>
    <rect x="606" y="0" width="14" height="14" rx="3" fill="none" stroke="#e34948" stroke-width="1.6" stroke-dasharray="3 2"/>
    <text x="626" y="11" class="small muted">output that only exists with the future present</text>
  </g>
  <text x="40" y="334" class="small muted">Repeated at 64 cutoffs per test by default. The perturbation test scrambles the future instead of removing it.</text>
  <text x="940" y="334" text-anchor="end" class="small" style="font-weight:700; fill:#898781">peekproof</text>
</svg>
