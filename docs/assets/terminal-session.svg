<defs><filter id="shadow" x="-5%" y="-5%" width="110%" height="120%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/></filter></defs>
<rect x="18.5" y="18.5" width="939" height="587" rx="12" fill="#1a1a19" stroke="#ffffff" stroke-opacity="0.08" filter="url(#shadow)"/>
<circle cx="42" cy="39" r="6.5" fill="#ff5f57"/>
<circle cx="62" cy="39" r="6.5" fill="#febc2e"/>
<circle cx="82" cy="39" r="6.5" fill="#28c840"/>
<text x="488.0" y="44" text-anchor="middle" fill="#c3c2b7" style="font-family:system-ui,-apple-system,sans-serif;font-size:13px;font-weight:600">peekproof</text>
<g transform="translate(18,18)">
<text class="l0" x="22" y="58"><tspan fill="#898781">$ </tspan></text>
<text class="l1" x="22" y="79"><tspan fill="#f3f2ec">peekproof: </tspan><tspan fill="#e66767" class="b">NOT CAUSAL</tspan><tspan fill="#f3f2ec">  (deterministic, 123 cutoffs, 130 evaluations, 1000 rows)</tspan></text>
<text class="l2" x="22" y="100"><tspan fill="#f3f2ec">  column &#x27;close&#x27;: 123 cutoff(s) affected, kind=value_change, max |diff| = 21.1</tspan></text>
<text class="l3" x="22" y="121"><tspan fill="#f3f2ec">    first affected row 2021-01-18</tspan></text>
<text class="l4" x="22" y="142"><tspan fill="#f3f2ec" class="b">  verdict: output at t depends on rows after t, horizon = 9 row(s).</tspan></text>
<text class="l5" x="22" y="163"><tspan fill="#898781">$ </tspan></text>
<text class="l6" x="22" y="184"><tspan fill="#f3f2ec">strategy.py:11:32: </tspan><tspan fill="#d95926" class="b">PP003</tspan><tspan fill="#f3f2ec"> </tspan><tspan fill="#e66767">[high]</tspan><tspan fill="#f3f2ec"> rolling(center=True) uses rows after the current one</tspan></text>
<text class="l7" x="22" y="205"><tspan fill="#898781">    hint: Use a trailing window: rolling(n) without center=True, ewm(...), or a causal filter such as</tspan></text>
<text class="l8" x="22" y="226"><tspan fill="#898781">          scipy.signal.lfilter.</tspan></text>
<text class="l9" x="22" y="247"><tspan fill="#f3f2ec">strategy.py:12:28: </tspan><tspan fill="#d95926" class="b">PP001</tspan><tspan fill="#f3f2ec"> </tspan><tspan fill="#e66767">[high]</tspan><tspan fill="#f3f2ec"> shift(-1) pulls future values into the current row</tspan></text>
<text class="l10" x="22" y="268"><tspan fill="#898781">    hint: Shift by a positive number of rows (look back). Forward-looking label code belongs in a</tspan></text>
<text class="l11" x="22" y="289"><tspan fill="#898781">          function marked &#x27;# peekproof: label&#x27;.</tspan></text>
<text class="l12" x="22" y="310"><tspan fill="#f3f2ec">strategy.py:13:48: </tspan><tspan fill="#d95926" class="b">PP006</tspan><tspan fill="#f3f2ec"> </tspan><tspan fill="#c98500">[medium]</tspan><tspan fill="#f3f2ec"> full-sample mean() is combined with the same series</tspan></text>
<text class="l13" x="22" y="331"><tspan fill="#898781">    hint: Use expanding()/rolling() statistics (shifted by one bar if needed) so each row sees only</tspan></text>
<text class="l14" x="22" y="352"><tspan fill="#898781">          the past. Confirm with peekproof.check().</tspan></text>
<text class="l15" x="22" y="373"><tspan fill="#f3f2ec">strategy.py:14:15: </tspan><tspan fill="#d95926" class="b">PP002</tspan><tspan fill="#f3f2ec"> </tspan><tspan fill="#e66767">[high]</tspan><tspan fill="#f3f2ec"> bfill() copies later observations into earlier rows</tspan></text>
<text class="l16" x="22" y="394"><tspan fill="#898781">    hint: Use ffill() so a gap is filled from the past only, or leave the gap and drop it.</tspan></text>
<text class="l17" x="22" y="415"><tspan fill="#f3f2ec">strategy.py:24:40: </tspan><tspan fill="#d95926" class="b">PP005</tspan><tspan fill="#f3f2ec"> </tspan><tspan fill="#e66767">[high]</tspan><tspan fill="#f3f2ec"> train_test_split shuffles rows by default (future rows reach training)</tspan></text>
<text class="l18" x="22" y="436"><tspan fill="#898781">    hint: Split by time: train_test_split(..., shuffle=False), TimeSeriesSplit, or a purged/embargoed</tspan></text>
<text class="l19" x="22" y="457"><tspan fill="#898781">          splitter.</tspan></text>
<text class="l20" x="22" y="478"><tspan fill="#f3f2ec">strategy.py:29:13: </tspan><tspan fill="#d95926" class="b">PP010</tspan><tspan fill="#f3f2ec"> </tspan><tspan fill="#c98500">[medium]</tspan><tspan fill="#f3f2ec"> &#x27;signal&#x27; is multiplied by &#x27;df[&quot;ret&quot;]&#x27; without a one-bar lag</tspan></text>
<text class="l21" x="22" y="499"><tspan fill="#898781">    hint: Lag the position by one bar (position.shift(1) * returns) so a signal only earns the next</tspan></text>
<text class="l22" x="22" y="520"><tspan fill="#898781">          bar&#x27;s return. Confirm with peekproof.check().</tspan></text>
<text class="l23" x="22" y="541"><tspan fill="#f3f2ec">peekproof: 6 findings</tspan></text>
